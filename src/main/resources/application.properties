## General settings
spring.application.name=ai-forgot-these-cards
server.port=${APP_SERVER_PORT:8080}
server.forward-headers-strategy=framework
spring.main.banner-mode=off
spring.main.allow-bean-definition-overriding=true

# Session timeout - idle time before session expires (e.g., 30m, 1h, 3600s)
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

# HTTP connection timeouts
server.tomcat.connection-timeout=${CONNECTION_TIMEOUT:20s}
spring.mvc.async.request-timeout=${ASYNC_REQUEST_TIMEOUT:60m}

# AI model settings for local Llama.cpp server using OpenAI API compatibility
spring.ai.model.chat=openai
spring.ai.openai.chat.base-url=${LLAMACPP_URL:http://localhost:8087}
spring.ai.openai.api-key=not-set

# AI HTTP client read timeout: how long to wait for the AI backend (llama.cpp) to respond.
# Must be shorter than nginx proxy_read_timeout (660s) so the server can send a clean
# HTTP 500 before the network layer resets the TCP connection (which browsers see as
# a TypeError rather than an HTTP error).
# See AI_CLIENT_READ_TIMEOUT in .env / .env.example.
ai.client.read-timeout=${AI_CLIENT_READ_TIMEOUT:PT10M}

# TTS sidecar settings. The Java backend owns auth/cache/API behavior and calls a
# Python service for direct PyTorch/Transformers inference.
tts.service-url=${TTS_SERVICE_URL:http://localhost:8091}
tts.storage-dir=${TTS_STORAGE_DIR:./data/tts}
tts.request-timeout=${TTS_REQUEST_TIMEOUT:PT30M}

# PostgreSQL connection settings
# Default to the Makefile-managed Postgres host port (5433). Override via DB_URL when needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/${POSTGRES_DB:cards}}
spring.datasource.username=${POSTGRES_USER:cards}
spring.datasource.password=${POSTGRES_PASSWORD:cards}

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=true
spring.data.jpa.repositories.enabled=true

# Versioned schema migrations. PostgreSQL is the default runtime database;
# DatabaseVendorEnvironmentPostProcessor switches this location for SQLite mode.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing Hibernate-managed schema

# Springdoc settings
spring.web.resources.static-locations=classpath:/META-INF/resources/, classpath:/resources/, classpath:/static/, classpath:/public/
spring.web.resources.chain.strategy.fixed.enabled=true
spring.web.resources.chain.strategy.fixed.paths=/**
spring.web.resources.chain.strategy.fixed.version=v1
springdoc.show-actuator=true
springdoc.use-management-port=false
#springdoc.swagger-ui.enabled=true
#springdoc.api-docs.enabled=true

# Management settings
management.endpoints.web.exposure.include=health,metrics

logging.level.root=warn
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=warn
logging.level.org.springframework.security=warn
logging.level.org.springframework.security.web.firewall=warn
logging.level.com.darkmusic.aiforgotthesecards.business.entities.services.TtsService=info

